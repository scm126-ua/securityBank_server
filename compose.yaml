# Entorno de desarrollo local de SecurityBank (frontend + backend + base de datos).
#
# Antes del primer arranque, copia .env.example como .env.
#
#   docker compose up --build   -> construye las imágenes, aplica las migraciones y arranca los servicios
#   docker compose down         -> detiene los servicios (los datos de PostgreSQL se conservan)
#
# El acceso web se realiza mediante HTTPS en localhost:8443. PostgreSQL también
# se publica en localhost para permitir su uso desde DBeaver.

name: securitybank

services:
  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      # Puerto del host para DBeaver. Dentro de Docker, el backend usa siempre db:5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Volumen persistente: los datos sobreviven a "docker compose down".
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Comprueba por TCP que PostgreSQL acepta conexiones.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Aplica las migraciones pendientes de database/migrations/ y termina.
  # Se ejecuta en cada "docker compose up"; si no hay nada pendiente, no hace nada.
  # También se usa para gestionar migraciones a mano, por ejemplo:
  #   docker compose run --rm migrate version
  migrate:
    image: migrate/migrate:v4.20.1
    # Las migraciones usan el propietario de las tablas; el backend, un rol con privilegios mínimos.
    entrypoint: ["migrate", "-path=/migrations", "-database=${MIGRATE_DATABASE_URL:?Define MIGRATE_DATABASE_URL en .env}"]
    command: ["up"]
    working_dir: /migrations
    volumes:
      - ./database/migrations:/migrations
    depends_on:
      db:
        condition: service_healthy

  # Asigna al rol securitybank_app (creado por las migraciones) la contraseña de .env y termina.
  app-role:
    image: postgres:17.11-alpine3.24
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en .env}
    command: ["sh", "-c", "echo \"ALTER ROLE securitybank_app WITH LOGIN PASSWORD :'password'\" | psql -q -v ON_ERROR_STOP=1 -v password=\"$$APP_DB_PASSWORD\""]
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en .env}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost:8443}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
    volumes:
      # El código del host se monta en el contenedor y Air detecta los cambios.
      - .:/app
    depends_on:
      db:
        # El backend no arranca hasta que el healthcheck de PostgreSQL es correcto...
        condition: service_healthy
      app-role:
        # ...y las migraciones y el rol de la aplicación están preparados.
        condition: service_completed_successfully

  frontend:
    build: ../securityBank_client/securityBank_client
    environment:
      # Activa el sondeo de ficheros en Vite (necesario en Docker sobre Windows).
      CHOKIDAR_USEPOLLING: "true"
      # Huella de la clave del servidor que exige el frontend. Vacía: se fija en el primer acceso.
      VITE_SERVER_KEY_FINGERPRINT: ${SERVER_KEY_FINGERPRINT:-}
    volumes:
      # El código del host se monta en el contenedor y Vite recarga en caliente.
      - ../securityBank_client/securityBank_client:/app
      # node_modules se queda dentro del contenedor (dependencias compiladas para Linux).
      - /app/node_modules

  # Punto de entrada HTTPS para el navegador. La CA local se conserva en un
  # volumen y puede instalarse como autoridad de confianza en el equipo host.
  proxy:
    image: caddy:2.11.7-alpine
    ports:
      - "127.0.0.1:${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
